backend:
  name: github
  repo: dfh-nrt/dfh-nrt.github.io
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "posts"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD HH:mm:ss Z"

      - label: "Author"
        name: "author"
        widget: "string"
        required: false

      - label: "Tags"
        name: "tags"
        widget: "list"
        default:
          - Other

      - label: "Body"
        name: "body"
        widget: "markdown"
