backend:
  name: github
  repo: dfh-nrt/dfh-nrt.github.io
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "_posts"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Tags"
        name: "tags"
        widget: "list"
        default:
          - Other

      - label: "Body"
        name: "body"
        widget: "markdown"
